// Dagger app <-> rover contract. Schema v1 (Phase 1).
//
// One file is the whole interface between the operator app (Kotlin) and the
// rover gateway (Python). Code for both sides is generated from it.
//
// TRANSPORT
//   WebSocket, binary frames. Every frame carries exactly one Envelope.
//   Fake rover: ws://<host>:8082/api   (gateway port to be fixed in Phase 1)
//
// RULES (docs/handoff.md section 8) — these are not optional:
//   1. Version handshake on connect. The app's first message is Hello. The rover
//      answers HelloReply; if `accepted` is false the app shows "Update needed"
//      and sends nothing else.
//   2. Only ADD fields. Never renumber, never reuse a number, never change a
//      type. A field that is no longer wanted is left in place, or its number is
//      listed in `reserved`.
//   3. Commands are safe to repeat. A command carries a `command_id`; resending
//      the same id has no second effect, and gets the same CommandResult again.
//   4. The rover advertises what it supports (HelloReply.capabilities). The app
//      shows only those behaviours.
//   5. STOP jumps the queue, is resent until acknowledged, and needs no
//      confirmation from the person.
//   6. Alerts and rejections are codes plus values. The app owns the wording,
//      so translation never needs a rover change.
//   7. Every message carries a rover ID, so a fleet view later is one more
//      client, not a new protocol.
//
// UNITS: SI throughout, stated in each field name or comment. Times are
// milliseconds. Angles are degrees. Positions are WGS84.

syntax = "proto3";

package dagger.api;

option java_package = "com.cfr.daggergcs.protocol";
option java_multiple_files = true;

// Bumped whenever the meaning of the contract changes in a way an older peer
// would misread. Adding a field does NOT need a bump.
// v0: the Phase 0 draft, never deployed.
// v1: first version the app and the gateway are built against (Phase 1).
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_0 = 1;
  PROTOCOL_VERSION_1 = 2;
}

// ---------------------------------------------------------------------------
// Framing
// ---------------------------------------------------------------------------

message Envelope {
  // The rover this message is from (rover -> app) or for (app -> rover).
  // Before the handshake the app may leave it empty; the rover fills it in
  // HelloReply and the app uses it from then on.
  string rover_id = 1;

  // Sender's wall clock, UTC, milliseconds since the Unix epoch. For logs and
  // for showing "last heard N s ago". Never used to measure delay: the two
  // clocks are not synchronised. Heartbeat carries what is needed for that.
  uint64 sent_at_ms = 2;

  oneof body {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    Heartbeat heartbeat = 12;
    RoverState state = 13;
    Command command = 14;
    CommandResult command_result = 15;
    // Rover -> app, reliable and in order: things that HAPPENED (an alert
    // raised or cleared, a state change and why). The app uses them for
    // sounds, spoken messages and the history; what is true NOW is always in
    // RoverState.
    Event event = 16;
    // Rover -> app: limits and timings the app must use. Sent right after
    // HelloReply and again whenever they change. Never hard-coded in the app.
    RoverSettings settings = 17;
    // Rover -> app, on the VIDEO channel only (ws://<rover>:8090/video, its own
    // WebSocket, so a large frame can never delay a STOP on /api): the newest
    // camera picture. Latest frame only: a slow link drops frames, never queues.
    VideoFrame video_frame = 18;

    // Rover -> app: the saved routes. Sent right after HelloReply (with the
    // settings) and again whenever the list changes. Complete every time.
    RouteList routes = 19;

    // Rover -> app, on the VIDEO channel: who the camera sees, for the frame
    // with the same stamp (sent just after it, ~50 ms later).
    Targets targets = 20;

    // Rover -> app: the saved maps, and which one is shown under missions.
    // Sent right after HelloReply (with the routes) and again whenever either
    // changes. Complete every time. Pictures are NOT in it: see MapSummary.
    MapList maps = 21;

    // Rover -> app: the RTK base's saved sites (places the base stands, with
    // known coordinates). Sent right after HelloReply and whenever the list
    // changes. Complete every time.
    BaseSites base_sites = 22;
  }
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// App -> rover, first message on every connection.
message Hello {
  ProtocolVersion protocol_version = 1;
  // The app's own version, e.g. "0.1.0 (12)". For logs and update offers.
  string app_version = 2;
  // Identifies the handset, stable across restarts. For logs and, later,
  // for telling several handsets apart.
  string client_id = 3;
}

// Rover -> app, answer to Hello.
message HelloReply {
  // False when the rover cannot talk to this app version. The app then shows
  // "Update needed" and does nothing else on this connection.
  bool accepted = 1;
  ProtocolVersion protocol_version = 2;
  string rover_id = 3;
  // Human-readable rover name for the Connect screen, e.g. "Dagger 1".
  string rover_name = 4;
  string rover_software_version = 5;
  // What this rover can do. The app shows only these.
  // [packed = true] is proto3's default anyway; written out because Wire
  // only packs repeated enums when told to, and both sides must produce
  // identical bytes (proto/vectors).
  repeated Capability capabilities = 6 [packed = true];
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_STOP = 1;
  CAPABILITY_READINESS = 2;
  CAPABILITY_ALERTS = 3;
  CAPABILITY_RUN_ROUTE = 4;      // runs saved routes (StartRoute, Pause, Resume, Cancel)
  CAPABILITY_RECORD_ROUTE = 5;   // records a route while the operator drives
  CAPABILITY_PLAN_ROUTE = 6;     // stores missions planned on the map in the app (SaveRoute)
  CAPABILITY_IMPORT_MISSION = 7; // keeps the mission last sent to the autopilot, e.g. from QGC (ImportMission)
  CAPABILITY_COME_HOME = 8;      // drives back to where the session's first job started (ComeHome)
  CAPABILITY_FOLLOW = 9;         // video + targets on /video; SelectTarget, StartFollow, StopFollow
  CAPABILITY_MAPS = 10;          // the saved SLAM maps: MapList, pictures over HTTP; ShowMap, DeleteMap
  CAPABILITY_MAKE_MAP = 11;      // makes maps while the operator drives: StartMapping, SaveMap, DiscardMapping
  CAPABILITY_BASE_STATION = 12;  // the RTK base: RoverState.base, BaseSites; SurveyBase, UseBaseSite, SaveBaseSite, DeleteBaseSite
  CAPABILITY_FIND_ON_MAP = 13;   // Step D2: "I am here" (SetHereOnMap), MapPosition's pose and finding, maps
                                 // that are not placed in use (shown, missions on them), JOB_RUN_MAP_MISSION
  CAPABILITY_SET_HOME = 14;      // the operator moves home (SetHome); home is kept across restarts
  CAPABILITY_HOME_ON_MAP = 15;   // home on a saved map (indoors, no GPS): RoverState.home_on_map, SetHome on_map;
                                 // Return to Home driven on the map in use when the rover is found on it
  // Later: CAPABILITY_FOLLOW, CAPABILITY_GO_TO_PLACE, ...
}

// ---------------------------------------------------------------------------
// Heartbeat — both directions, 4 Hz
// ---------------------------------------------------------------------------
//
// Each side sends its own heartbeats and echoes the last one it received. That
// lets each side measure the round trip on its OWN clock, with no clock sync:
//   round_trip = now - echo_sent_time_ms - echo_hold_ms
// Silence is what matters most: the rover's link-loss policy (follow stops
// after 1.5 s without the app) is driven by missing heartbeats.

message Heartbeat {
  // Increases by one per heartbeat from this sender, per connection.
  uint32 seq = 1;
  // Sender's monotonic clock, milliseconds. Only ever compared with itself.
  uint64 sent_time_ms = 2;

  // Echo of the most recent heartbeat received from the other side.
  uint32 echo_seq = 3;
  uint64 echo_sent_time_ms = 4;
  // How long the sender held that heartbeat before echoing it.
  uint32 echo_hold_ms = 5;
}

// ---------------------------------------------------------------------------
// State — rover -> app, 5 Hz, latest wins, never queued
// ---------------------------------------------------------------------------
//
// A complete picture every time: the app draws the newest one it has and
// throws older ones away. Nothing in it is a delta.

message RoverState {
  // Increases by one per state message, per connection. Lets the app drop a
  // late-arriving older state.
  uint64 seq = 1;

  OperatingState operating_state = 2;

  // Absent when the rover has no position at all.
  Position position = 3;
  // Absent when the rover does not know which way it is facing. Kept separate
  // from position on purpose: GNSS heading fails differently (and is fixed
  // differently) from GNSS position.
  Heading heading = 4;

  // Over the ground, metres per second, never negative.
  float speed_mps = 5;

  // Absent when the rover cannot measure it. Never sent as a made-up value:
  // a battery gauge that cannot measure is worse than none.
  Battery battery = 6;

  // The rover's own view of the app link, from its heartbeats.
  Link link = 7;

  // The readiness checks, every time, in the rover's order. The app shows
  // them in the status strip and on the Ready check screen; the rover decides
  // their status and which jobs each one blocks.
  repeated ReadinessCheck readiness = 8;

  // Motors armed. Arming stays on the physical RC switch; the app only tells
  // the operator when arming is needed (an ACTION alert) and never arms.
  bool armed = 9;

  // Everything currently wrong or waiting, highest severity first. Complete
  // every time: an alert that is not here is not active.
  repeated Alert active_alerts = 10;

  // Absent unless a route is running or paused.
  RouteProgress route = 11;

  // Absent unless a recording is in progress, or stopped and not yet saved or
  // discarded (a STOP keeps the points; the operator then saves or discards).
  RecordingProgress recording = 12;

  // Where Come home goes: the rover's position when the first job since the
  // gateway started began. Absent until then. The app draws it on the map.
  // With CAPABILITY_SET_HOME: or where the operator put it (SetHome), kept across restarts.
  Position home = 13;

  // The person or marker picked to follow, and how the rover sees it. Absent
  // when nothing is picked.
  FollowStatus follow = 14;

  // While making a map (MAPPING, and kept after a STOP until saved or
  // discarded): the map so far. Absent otherwise.
  MappingProgress mapping = 15;

  // Where the rover is on a saved map (Step D1): set while it is finding itself
  // on the map shown under missions. Absent when no map is in use.
  MapPosition map_position = 16;

  // The RTK base station, as the rover hears it over its radio. Absent when
  // the rover has no base support.
  BaseStation base = 17;

  // Home on a saved map (CAPABILITY_HOME_ON_MAP): set indoors with no GPS, on the map the
  // rover was found on. Absent when home is a place on the Earth only (`home`). When that
  // map is placed, `home` carries the same spot as lat/lon too.
  HomeOnMap home_on_map = 18;
}

message HomeOnMap {
  string map_name = 1;
  // On the map's picture, metres as MapPosition (from its bottom-left corner, x right, y up).
  double x_m = 2;
  double y_m = 3;
}

message FollowStatus {
  int32 target_id = 1;          // Target.id
  TargetState state = 2;
  float range_m = 3;            // 0 when unknown
}

// How the rover sees the picked target.
enum TargetState {
  TARGET_STATE_UNSPECIFIED = 0;
  TARGET_STATE_TRACKING = 1;    // in the picture
  TARGET_STATE_HOLD = 2;        // out of the picture, still held by the LiDAR
  TARGET_STATE_LOST = 3;        // gone: following searches by turning, then stops
}

// ---------------------------------------------------------------------------
// Video channel — rover -> app on ws://<rover>:8090/video
// ---------------------------------------------------------------------------

message VideoFrame {
  double stamp_s = 1;           // camera time; Targets with the same stamp belong to it
  uint32 width = 2;             // pixels, as the camera delivers them
  uint32 height = 3;
  int32 rotation_deg = 4;       // how the camera is mounted: rotate by this to show it upright
  bytes jpeg = 5;
}

message Targets {
  double stamp_s = 1;           // the VideoFrame these belong to
  uint32 width = 2;
  uint32 height = 3;
  int32 rotation_deg = 4;
  repeated Target targets = 5;
  int32 selected_id = 6;        // -1: none
}

message Target {
  int32 id = 1;                 // stable while seen; never reused
  TargetKind kind = 2;
  // PERSON: x1, y1, x2, y2. MARKER: its outline, 4 corners as x, y pairs.
  // Pixels in the camera's own orientation (see rotation_deg).
  repeated float outline = 3;
  bool selectable = 4;          // a person ranged by the LiDAR, a marker seen often enough
  float range_m = 5;            // 0 when unknown
  bool visible = 6;             // seen in this frame (else carried on by the tracker)
}

enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  TARGET_KIND_PERSON = 1;
  TARGET_KIND_MARKER = 2;
}

// The one state machine the gateway owns. The app shows this and never
// invents its own.
enum OperatingState {
  OPERATING_STATE_UNSPECIFIED = 0;
  OPERATING_STATE_STARTING = 1;       // services coming up
  OPERATING_STATE_NOT_READY = 2;      // up, but a readiness check fails
  OPERATING_STATE_READY = 3;
  OPERATING_STATE_RUNNING_ROUTE = 4;
  OPERATING_STATE_FOLLOWING = 5;
  OPERATING_STATE_PAUSED = 6;
  OPERATING_STATE_STOPPED = 7;        // stopped by a STOP command
  OPERATING_STATE_FAULT = 8;
  OPERATING_STATE_RECORDING = 9;      // the operator drives; the rover takes notes
  OPERATING_STATE_COMING_HOME = 10;   // driving back home along its own trail
  OPERATING_STATE_MAPPING = 11;       // the operator drives; the rover makes a map
}

// How far the app may trust a position or heading. Deliberately in terms of
// what the operator can be told, not in GNSS fix types: the gateway maps fix
// type, accuracy and EKF health onto these.
enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_NONE = 1;     // no usable value
  QUALITY_POOR = 2;     // usable for showing, not for driving a route
  QUALITY_GOOD = 3;     // good enough to drive a route
}

message Position {
  double latitude_deg = 1;
  double longitude_deg = 2;
  // One-sigma horizontal accuracy, metres.
  float horizontal_accuracy_m = 3;
  Quality quality = 4;
  // RTK: corrections from the base station in use. Set by rovers that know.
  RtkStatus rtk = 5;
  // Worked out by the rover from its own odometry since the last good GPS fix (GPS
  // lost, Step D3), not measured: draw it as approximate. quality is then POOR.
  bool from_odometry = 6;
}

message Heading {
  // Direction the rover is facing, degrees clockwise from true north, [0, 360).
  float heading_deg = 1;
  // One-sigma accuracy, degrees.
  float accuracy_deg = 2;
  Quality quality = 3;
}

message Battery {
  // State of charge, 0 to 100.
  float percent = 1;
  float voltage_v = 2;
}

// ---------------------------------------------------------------------------
// Readiness
// ---------------------------------------------------------------------------

message ReadinessCheck {
  CheckId id = 1;
  CheckStatus status = 2;
  // Jobs this check stops from starting while it is not PASS. Empty means it
  // is advisory only.
  repeated Job blocks = 3 [packed = true];  // see HelloReply.capabilities
  // Numbers the app may show with its own wording, e.g. {"percent": 18} for
  // battery, {"valid_percent": 42} for heading. Keys are listed per CheckId.
  map<string, double> values = 4;
}

// What the operator is told is ready or not. The gateway maps its detailed
// checks (tools/preflight.py and friends) onto these.
enum CheckId {
  CHECK_ID_UNSPECIFIED = 0;
  CHECK_FLIGHT_CONTROLLER = 1;  // FCU connected, data flowing at the needed rates
  CHECK_REMOTE_CONTROL = 2;     // RC link to the handset sticks is alive
  CHECK_POSITION = 3;           // GNSS position good and the estimator steady
  CHECK_HEADING = 4;            // GNSS heading valid
  CHECK_OBSTACLE_SENSOR = 5;    // LiDAR running at rate
  CHECK_LOCALISATION = 6;       // the rover knows where it is on the map (Step D2: the GPS map,
                                // or found on the shown saved map)
  CHECK_NAVIGATION = 7;         // route driving (Nav2) up
  CHECK_BATTERY = 8;            // values: percent
  CHECK_CAMERA = 9;             // needed for following only
  // Step D2: the autopilot has a position it can drive on -- GPS, or with no GPS its
  // indoor (LiDAR) source -- and its estimator is steady. values: needs_switch (1: the
  // rover does not change the source itself; the INDOOR switch must be set by hand).
  CHECK_DRIVE_SOURCE = 10;
}

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_PENDING = 1;     // not yet known (starting up)
  CHECK_STATUS_PASS = 2;
  CHECK_STATUS_WARN = 3;        // usable, but the operator should know
  CHECK_STATUS_FAIL = 4;
}

// The operator's jobs, so the rover can say which ones are possible right now.
enum Job {
  JOB_UNSPECIFIED = 0;
  JOB_RUN_ROUTE = 1;
  JOB_GO_TO_PLACE = 2;
  JOB_FOLLOW = 3;
  JOB_COME_HOME = 4;
  JOB_RECORD_ROUTE = 5;
  JOB_MAKE_MAP = 6;              // needs the obstacle sensor, not GPS (indoors too)
  // A mission on a saved map (RouteSummary.map_name), Step D2: needs the rover found on
  // the map (MapPosition) and CHECK_DRIVE_SOURCE, not GPS. JOB_RUN_ROUTE is then a GPS
  // mission. Rovers without CAPABILITY_FIND_ON_MAP block map missions as JOB_RUN_ROUTE.
  JOB_RUN_MAP_MISSION = 7;
}

// ---------------------------------------------------------------------------
// Alerts and events
// ---------------------------------------------------------------------------

// Rule 6: a code plus values. The app owns every word the operator reads, so
// wording and translation never need a rover change.
message Alert {
  // Unique for the life of the rover process; the same id in Event
  // alert_cleared ends it.
  uint32 id = 1;
  AlertCode code = 2;
  Severity severity = 3;
  // Numbers for the wording, e.g. {"percent": 18}, {"seconds": 12}.
  map<string, double> values = 4;
  // Rover's wall clock (UTC ms) when it was raised, for "for 2 minutes".
  uint64 raised_at_ms = 5;
}

// ISA-101: neutral is normal; colour means something.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;            // no colour
  SEVERITY_WARNING = 2;         // amber
  SEVERITY_PROBLEM = 3;         // red
  SEVERITY_ACTION = 4;          // blue: the rover is waiting for the operator
}

// One per thing the operator can be told. Wording lives in the app
// (docs/handoff.md section 10 has the first translations).
enum AlertCode {
  ALERT_CODE_UNSPECIFIED = 0;
  ALERT_POSITION_NOT_ACCURATE = 1;   // EKF unhealthy, GNSS poor
  ALERT_HEADING_UNKNOWN = 2;         // GNSS heading invalid
  ALERT_PATH_BLOCKED = 3;            // collision monitor holding; values: seconds
  ALERT_NO_PATH = 4;                 // Nav2 gave up
  ALERT_FOLLOW_TARGET_LOST = 5;      // values: seconds
  ALERT_LINK_WEAK = 6;
  ALERT_BATTERY_LOW = 7;             // values: percent
  ALERT_BATTERY_CRITICAL = 8;        // failsafe level; values: percent
  ALERT_ARM_WITH_SWITCH = 9;         // ACTION: arm on the RC switch to continue
  ALERT_RC_LINK_LOST = 10;           // sticks not reaching the rover
  ALERT_SERVICE_RESTARTING = 11;     // a rover service died and is coming back
  ALERT_STOPPED_BY_OPERATOR = 12;    // after STOP, until the next job
  ALERT_PAUSED_APP_SILENT = 13;      // route paused: app was silent; values: seconds
  // Step D3 (GPS loss during a job). GPS is lost when, for a few seconds (rover
  // settings), there is no 3-D fix, or the accuracy is worse than the limit, or the
  // GNSS heading is gone.
  ALERT_GPS_LOST = 14;               // ACTION: a GPS mission or the way home paused; the
                                     // app offers Come home (ComeHome), Carry on
                                     // (ResumeRoute: on LiDAR), Stop here (CancelRoute).
                                     // values: lidar_m, metres already driven on LiDAR
                                     // when it asks again at the limit
  ALERT_NO_GPS_ON_LIDAR = 15;        // WARNING: carrying on with no GPS, on LiDAR alone;
                                     // values: metres_left before it pauses to ask again
  ALERT_NO_GPS_ON_MAP = 16;          // WARNING: no GPS; a map mission goes on, on the map
  ALERT_RTK_LOST = 17;               // WARNING: the base is sending, but the rover is
                                     // not RTK float/fixed: positions are metres, not cm
  ALERT_POSITION_DISAGREES = 18;     // WARNING: the autopilot's heading or position does
                                     // not match GPS for a few seconds (e.g. its indoor
                                     // source selected outdoors); values: degrees, metres
}

message Event {
  // Increases by one per event, per connection.
  uint64 seq = 1;
  oneof kind {
    Alert alert_raised = 10;
    // The id of an alert that is no longer active.
    uint32 alert_cleared = 11;
    StateChange state_changed = 12;
    // A point of the running route was reached.
    WaypointReached waypoint_reached = 13;
  }
}

message WaypointReached {
  string route_id = 1;
  uint32 index = 2;  // 1-based
}

message StateChange {
  OperatingState from_state = 1;
  OperatingState to_state = 2;
  StateReason reason = 3;
}

// Why the operating state changed. The app plays a sound and speaks the reason
// for anything that stopped or paused the rover.
enum StateReason {
  STATE_REASON_UNSPECIFIED = 0;
  STATE_REASON_OPERATOR = 1;         // the operator's command (STOP, start, pause)
  STATE_REASON_APP_SILENT = 2;       // link-loss policy
  STATE_REASON_ROUTE_FINISHED = 3;
  STATE_REASON_PATH_BLOCKED = 4;
  STATE_REASON_FAULT = 5;
  STATE_REASON_RC_OVERRIDE = 6;      // the sticks took over
  STATE_REASON_READINESS = 7;        // a readiness check changed
  STATE_REASON_HOME_REACHED = 8;     // Come home arrived
  STATE_REASON_GPS_LOST = 9;         // paused: GPS lost (Step D3); ALERT_GPS_LOST asks
}

// ---------------------------------------------------------------------------
// Settings — rover -> app
// ---------------------------------------------------------------------------

// The rover's limits and timings. The app uses these and never its own.
message RoverSettings {
  // How often each side sends a heartbeat.
  uint32 heartbeat_period_ms = 1;
  // How often RoverState is sent.
  uint32 state_period_ms = 2;
  // Link-loss policy (decided 2026-10-08): follow stops after this much app
  // silence...
  uint32 follow_stop_after_silence_ms = 3;
  // ...and a running route pauses after this much. Supervisor-adjustable
  // within the bounds below; the rover enforces them.
  uint32 route_pause_after_silence_ms = 4;
  uint32 route_pause_after_silence_min_ms = 5;
  uint32 route_pause_after_silence_max_ms = 6;
  // Top speed the rover will drive any job at, m/s.
  float max_speed_mps = 7;
  // A recording keeps a point every this many metres (and at sharp turns).
  float record_point_spacing_m = 8;
}

message Link {
  // Round trip measured by the rover from the app's heartbeats. Absent until
  // the first echo arrives; 0 is a real reading (a fast local link).
  optional uint32 round_trip_ms = 1;
  // Milliseconds since the rover last heard from this app.
  uint32 since_last_heard_ms = 2;
}

// ---------------------------------------------------------------------------
// Commands — app -> rover, reliable, each answered by a CommandResult
// ---------------------------------------------------------------------------

message Command {
  // Unique per command, chosen by the app (a UUID). Resending the same id is
  // safe and has no second effect (rule 3).
  string command_id = 1;

  oneof kind {
    // STOP jumps the queue on both sides, is resent until a CommandResult
    // arrives, and never asks the person to confirm (rule 5).
    Stop stop = 10;
    StartRoute start_route = 11;
    PauseRoute pause_route = 12;
    ResumeRoute resume_route = 13;
    CancelRoute cancel_route = 14;
    StartRecording start_recording = 15;
    SaveRecording save_recording = 16;
    DiscardRecording discard_recording = 17;
    SaveRoute save_route = 18;
    ImportMission import_mission = 19;
    ComeHome come_home = 20;
    SelectTarget select_target = 21;
    StartFollow start_follow = 22;
    StopFollow stop_follow = 23;
    DeleteRoute delete_route = 24;
    ShowMap show_map = 25;
    DeleteMap delete_map = 26;
    StartMapping start_mapping = 27;
    SaveMap save_map = 28;
    DiscardMapping discard_mapping = 29;
    SurveyBase survey_base = 30;
    UseBaseSite use_base_site = 31;
    SaveBaseSite save_base_site = 32;
    DeleteBaseSite delete_base_site = 33;
    SetHereOnMap set_here_on_map = 34;
    SetHome set_home = 35;
  }
}

// Bring the rover to a stop and hold. Never a substitute for the RC sticks,
// which reach the flight controller on their own path.
message Stop {}

// Run a saved route from its first point. Accepted only when READY, armed,
// and no check that blocks JOB_RUN_ROUTE fails. Slide-to-start is the app's.
message StartRoute { string route_id = 1; }
// The running route: hold in place.
message PauseRoute {}
// The paused route: carry on to the same target point.
message ResumeRoute {}
// End the running or paused route; the rover holds and becomes READY.
message CancelRoute {}

// Start noting the rover's path while the operator drives with the sticks.
// Sends nothing to the flight controller.
message StartRecording {}
// Keep the recording as a route. An empty name means the rover's
// RecordingProgress.suggested_name. Accepted while recording, or after a STOP
// that ended one.
message SaveRecording { string name = 1; }
// Throw the recording away.
message DiscardRecording {}

// Keep a mission planned in the app: waypoints placed on the map, in driving
// order. Moves nothing, so it is accepted in any state. An empty name means the
// rover's suggested one. Rejected TOO_SHORT with fewer than two waypoints and
// NAME_TAKEN when the name is used (overwriting needs the PIN, later).
message SaveRoute {
  string name = 1;
  repeated Waypoint waypoints = 2;
  // A map mission (Step D1): the saved map (MapSummary.name, placed) the
  // waypoints belong to. They are kept as points ON that map and driven with
  // the rover finding itself on it -- the GPS error does not move them. Empty: a
  // GPS mission, as before. Rejected UNKNOWN_MAP when there is no such placed map.
  // Step D2 (CAPABILITY_FIND_ON_MAP): a map that is not placed too; its waypoints
  // then carry map_x_m / map_y_m (UNKNOWN_MAP when there is no such map at all).
  string map_name = 3;
}

// Keep the mission last sent to the autopilot (planned in QGroundControl or
// Mission Planner on another device) as a saved route. The rover reads the
// autopilot's mission, never writes it. Only waypoints with a position are kept,
// in order; the home point and other items (speeds, loiters, return home) are
// left out. Moves nothing, so it is accepted in any state. An empty name means
// the rover's suggested one. Rejected NO_MISSION when the autopilot holds no
// waypoints, TOO_SHORT with fewer than two, NAME_TAKEN as for SaveRoute.
message ImportMission { string name = 1; }

// Drive back home (RoverState.home) along the rover's own trail, thinned, with
// Nav2 going around anything new; trail points that are blocked are skipped.
// CAPABILITY_HOME_ON_MAP: when the rover is found on the map in use and home is on it
// (home_on_map, or a GPS home on a placed map), driven on that map like a map mission;
// RouteProgress.waypoints then carry map_x_m/map_y_m on a map that is not placed. Rejected
// NOT_ON_MAP when home is on a map the rover is not found on.
// Accepted when READY, armed, no check blocking JOB_COME_HOME fails, and a
// home is known (else NO_HOME). Pause / Resume / Cancel act on it as on a
// route; RoverState.route describes it, with route_id empty and the points.
message ComeHome {}

// Pick who to follow (Target.id), or -1 to let go. Moves nothing.
message SelectTarget { int32 target_id = 1; }
// Follow the picked target. Accepted when READY, armed, no check blocking
// JOB_FOLLOW fails (the camera among them), and a selectable target is picked
// (else NO_TARGET). The link-loss rule stops following after
// follow_stop_after_silence_ms of silence.
message StartFollow {}
// Stop following; the rover holds and becomes READY. Moves nothing.
message StopFollow {}

// Remove a saved route (a mission) from the rover for good. Moves nothing.
// Rejected UNKNOWN_ROUTE when there is no such route, NOT_IN_THIS_STATE while
// it is the route running or paused. (A PIN for this comes with the
// supervisor role, Phase 5.)
message DeleteRoute { string route_id = 1; }

// Draw this saved map under missions on every app connected (MapList.shown),
// or none when empty. Kept by the rover across restarts. Moves nothing.
// Rejected UNKNOWN_MAP when there is no such map.
message ShowMap { string name = 1; }

// Remove a saved map from the rover for good (all its files). Moves nothing.
// Rejected UNKNOWN_MAP; NOT_IN_THIS_STATE while the rover drives on it
// (Step D). If it was shown, nothing is shown after.
message DeleteMap { string name = 1; }

// Start making a map: the rover maps with its laser scanner while the operator
// drives with the sticks. Moves nothing by itself. Accepted when no job runs
// and no check blocking JOB_MAKE_MAP fails; the state becomes MAPPING.
message StartMapping {}
// Keep the map made so far under `name` (empty: MappingProgress.suggested_name).
// Answered at once; saving takes a few seconds (MappingProgress.saving), then
// the map is in MapList and the state leaves MAPPING. Tied to the Earth when
// GPS was good during the drive. Rejected NOT_IN_THIS_STATE when not mapping,
// NAME_TAKEN, TOO_SHORT when nothing was mapped yet.
message SaveMap { string name = 1; }
// Throw the map being made away; the state leaves MAPPING. Rejected
// NOT_IN_THIS_STATE when not mapping.
message DiscardMapping {}

// The RTK base (Step R1). None of these move the rover; all but SaveBaseSite and
// DeleteBaseSite change where the rover thinks it is, so they are rejected
// NOT_IN_THIS_STATE while a job runs (a mission, Follow, Return to Home), and
// NO_BASE when the base is not heard.
//
// Survey a new spot: the base averages its own position where it stands
// (BaseStation.mode SURVEYING) until it is good to BaseStation.survey_target_m,
// then sends corrections from it (FIXED, survey_done, site empty) -- keep it
// with SaveBaseSite to use the same spot another day.
message SurveyBase {}
// Use a saved site: the base sends corrections from that site's coordinates.
// The base must stand on that site's mark. Rejected UNKNOWN_SITE.
message UseBaseSite { string name = 1; }
// Keep the position just surveyed as a site (empty name: the suggested one).
// Rejected NOT_IN_THIS_STATE unless a survey is done and not yet kept, NAME_TAKEN.
message SaveBaseSite { string name = 1; }
// Forget a saved site. Rejected UNKNOWN_SITE. The base keeps going as it is.
message DeleteBaseSite { string name = 1; }

// "I am here" (Step D2): the operator taps where the rover stands on the shown map's
// picture (x_m, y_m as MapPosition). The rover searches around that spot, every way
// round, for where its laser scan fits the walls; MapPosition.finding says how it went.
// With has_front (asked for by MAP_FINDING_NEED_FRONT): a second tap, in front of the
// rover, and only directions towards it are tried. Moves nothing. Rejected UNKNOWN_MAP
// when there is no such map, NOT_ON_MAP when it is not the shown map, NOT_IN_THIS_STATE
// while a job drives (a mission running, following, coming home).
message SetHereOnMap {
  string map_name = 1;
  double x_m = 2;
  double y_m = 3;
  bool has_front = 4;
  double front_x_m = 5;
  double front_y_m = 6;
}

// Move home (RoverState.home), where Return to Home goes. Moves nothing. Kept by the rover
// across restarts. `here`: where the rover stands now (a GPS fix; its trail home starts
// again from here). Else `at`: a place on the Earth the operator tapped -- the way home
// goes back along the rover's trail as far as it leads, then plans the rest. Rejected
// NOT_IN_THIS_STATE while a job drives (a mission running or paused, coming home),
// NOT_READY when `here` and the rover has no GPS fix.
// CAPABILITY_HOME_ON_MAP: `here` with no GPS is where the rover is on the map in use
// (found on it); `on_map`: a spot tapped on the shown map's picture (map_x_m, map_y_m,
// metres as MapPosition) -- for a map that is not placed. Rejected NOT_READY when `here`
// and the rover has neither GPS nor its place on a map, NOT_ON_MAP when `on_map` names a
// map that is not the shown one.
message SetHome {
  bool here = 1;
  Waypoint at = 2;
  bool on_map = 3;
  string map_name = 4;
  double map_x_m = 5;
  double map_y_m = 6;
}

message CommandResult {
  string command_id = 1;
  CommandOutcome outcome = 2;
  // Set when outcome is REJECTED. The app turns the code into words.
  RejectReason reject_reason = 3;
  // With WAYPOINT_BLOCKED: which waypoint, 1-based.
  uint32 blocked_waypoint = 4;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_ACCEPTED = 1;
  COMMAND_OUTCOME_REJECTED = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  // This rover does not support the command (see HelloReply.capabilities).
  REJECT_REASON_NOT_SUPPORTED = 1;
  // Not allowed in the current operating state.
  REJECT_REASON_NOT_IN_THIS_STATE = 2;
  // Envelope.rover_id does not match this rover.
  REJECT_REASON_WRONG_ROVER = 3;
  // Sent before a successful handshake.
  REJECT_REASON_NO_HANDSHAKE = 4;
  // A readiness check that blocks this job is not passing.
  REJECT_REASON_NOT_READY = 5;
  // No saved route with that id.
  REJECT_REASON_UNKNOWN_ROUTE = 6;
  // The motors are not armed: arm with the RC switch, then try again.
  REJECT_REASON_NOT_ARMED = 7;
  // A route with that name exists; overwriting needs the PIN (Phase 5).
  REJECT_REASON_NAME_TAKEN = 8;
  // Fewer than two points were recorded.
  REJECT_REASON_TOO_SHORT = 9;
  // ImportMission: the autopilot holds no mission, or it could not be read.
  REJECT_REASON_NO_MISSION = 10;
  // ComeHome: no home yet (no job has started since the rover was switched on).
  REJECT_REASON_NO_HOME = 11;
  // StartRoute: a waypoint lies on something the rover sees as an obstacle and
  // no clear spot is within 1 m of it (CommandResult.blocked_waypoint says which).
  REJECT_REASON_WAYPOINT_BLOCKED = 12;
  // StartFollow: nobody (or nothing selectable) is picked.
  REJECT_REASON_NO_TARGET = 13;
  // ShowMap / DeleteMap: no saved map has that name.
  REJECT_REASON_UNKNOWN_MAP = 14;
  // StartRoute of a map mission: its map is not the one shown under missions,
  // or the rover has not found itself on it yet (MapPosition.located).
  REJECT_REASON_NOT_ON_MAP = 15;
  // Base commands: the base station is not heard (off, or out of radio range).
  REJECT_REASON_NO_BASE = 16;
  // UseBaseSite / DeleteBaseSite: no saved site has that name.
  REJECT_REASON_UNKNOWN_SITE = 17;
}

// ---------------------------------------------------------------------------
// Routes — made in the app by driving (Phase 3); the rover stores them
// ---------------------------------------------------------------------------

message RouteList {
  repeated RouteSummary routes = 1;
}

message RouteSummary {
  // Stable, chosen by the rover.
  string id = 1;
  // The operator's words, e.g. "Yard loop".
  string name = 2;
  double length_m = 3;
  // In order, to draw the route on the map.
  repeated Waypoint waypoints = 4;
  // Rover's wall clock (UTC ms) when it was saved.
  uint64 created_at_ms = 5;
  // A map mission: the map it belongs to (SaveRoute.map_name). Empty: GPS.
  string map_name = 6;
}

// WGS84. On a map that is not placed (Step D2) the point on the map instead.
message Waypoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  // On a map that is not placed (SaveRoute.map_name / RouteSummary.map_name name it):
  // the point on the map's picture, metres as MapPosition. latitude/longitude are then
  // 0 and mean nothing.
  double map_x_m = 3;
  double map_y_m = 4;
}

message RouteProgress {
  string route_id = 1;
  // The point the rover is driving to, 1-based: "point 3 of 12".
  uint32 target_index = 2;
  uint32 waypoint_count = 3;
  // 0..1 by distance along the route.
  float fraction_done = 4;
  double distance_remaining_m = 5;
  // The points being driven when they are not a saved route — the way home —
  // at most 200, in driving order. Empty for a saved route (the app has it).
  // On a map that is not placed: map_x_m/map_y_m (latitude/longitude 0).
  repeated Waypoint waypoints = 6;
  // The rover's plan for what it drives now: from where it is, through the points it
  // was sent, to point planned_through_index -- round what its LiDAR sees, straight
  // where the way is clear; GPS and map missions alike. Re-planned about once a second;
  // only its corners, at most 200 points. Latitude/longitude, or map_x_m/map_y_m on a
  // map that is not placed. Empty: no plan now (paused, between drives, or an older
  // rover) -- draw the points joined by straight lines.
  repeated Waypoint planned_path = 7;
  // 1-based: the last route point planned_path reaches. The legs after it are not
  // planned yet. 0 with no plan.
  uint32 planned_through_index = 8;
}

message RecordingProgress {
  // The points so far, to draw the path as it grows.
  repeated Waypoint waypoints = 1;
  double length_m = 2;
  // A name ready for the save box, e.g. "Route 3".
  string suggested_name = 3;
}

// ---------------------------------------------------------------------------
// Maps — SLAM maps the rover keeps (Step C)
// ---------------------------------------------------------------------------

message MapList {
  repeated MapSummary maps = 1;
  // The map drawn under missions (MapSummary.name), empty for none.
  string shown = 2;
}

message MapSummary {
  // Stable and unique; the operator's words, e.g. "Workshop". Also the id.
  string name = 1;
  // Size of the picture on the ground.
  float width_m = 2;
  float height_m = 3;
  // Tied to the Earth (made with good GPS): `corners` is set.
  bool placed = 4;
  // When placed: where the picture's corners are on the Earth, in this order:
  // top-left, top-right, bottom-right, bottom-left (as the picture is stored).
  // The picture may be turned; draw it on these four points.
  repeated Waypoint corners = 5;
  // How far the map and GPS disagreed when it was tied (rms, metres); 0 when
  // not placed.
  float placed_error_m = 6;
  // The picture: GET http://<rover host>:<port of /api><picture_path>, a PNG.
  // Grey levels: 0 = wall, 255 = free; transparent = never seen. The path
  // changes whenever the picture does, so the app may keep it by path.
  string picture_path = 7;
  uint32 picture_width_px = 8;
  uint32 picture_height_px = 9;
  // Rover's wall clock (UTC ms) when it was saved.
  uint64 created_at_ms = 10;
}

message MappingProgress {
  // The map so far, as a saved one is described (name empty): its size, its
  // picture (refreshed every few seconds; picture_path changes each time) and,
  // once GPS has tied it to the Earth, its corners.
  MapSummary map = 1;
  // A name ready for the save box, e.g. "Map 3".
  string suggested_name = 2;
  // Save was asked: the files are being written.
  bool saving = 3;
}

message MapPosition {
  // The map the rover is finding itself on: the one shown under missions.
  string map_name = 1;
  // It has found itself on it (its laser scan fits the map's walls). Map
  // missions on this map may start.
  bool located = 2;
  // Step D2. Where the rover is ON THE MAP'S PICTURE, once found (has_pose): metres
  // from the picture's bottom-left corner, x to the right along its bottom edge, y up
  // its left edge (the picture as stored: MapSummary.width_m x height_m). For a map
  // that is not placed this is the only position there is.
  bool has_pose = 3;
  double x_m = 4;
  double y_m = 5;
  // Which way the rover faces on the picture, degrees clockwise from the picture's up.
  float heading_deg = 6;
  // How finding itself is going. UNSPECIFIED from rovers before D2: `located` alone.
  MapFinding finding = 7;
}

enum MapFinding {
  MAP_FINDING_UNSPECIFIED = 0;
  MAP_FINDING_SEARCHING = 1;       // looking: from GPS on a placed map, or around the operator's tap
  MAP_FINDING_NEED_HERE = 2;       // it cannot look by itself (no GPS, no clear match from GPS, or it
                                   // lost its place): asks for "I am here" (SetHereOnMap)
  MAP_FINDING_NOT_FOUND_HERE = 3;  // the scan fits nowhere near the tap: tap again, or drive to where
                                   // more walls are in view
  MAP_FINDING_NEED_FRONT = 4;      // it fits several ways round at the tap: asks for SetHereOnMap again
                                   // with a tap in front of the rover (has_front)
  MAP_FINDING_FOUND = 5;           // found (located)
}

// ---------------------------------------------------------------------------
// RTK base station (Step R1)
// ---------------------------------------------------------------------------

enum RtkStatus {
  RTK_STATUS_UNSPECIFIED = 0;
  RTK_STATUS_NONE = 1;          // no corrections in use: GPS alone, metres
  RTK_STATUS_FLOAT = 2;         // corrections in use, not yet settled: decimetres
  RTK_STATUS_FIXED = 3;         // settled: centimetres (relative to the base)
}

enum BaseMode {
  BASE_MODE_UNSPECIFIED = 0;
  BASE_MODE_NO_FIX = 1;         // the base has no GPS fix yet
  BASE_MODE_SURVEYING = 2;      // averaging its own position (SurveyBase)
  BASE_MODE_FIXED = 3;          // sending corrections from a known position
}

message BaseStation {
  // Its messages arrive (over the rover's radio). False: off or out of range,
  // and the rest says what it last said.
  bool heard = 1;
  BaseMode mode = 2;
  // FIXED: the saved site it uses; empty when the position is a survey not yet kept.
  string site = 3;
  // SURVEYING: how good its position is so far, the goal, and for how long.
  float survey_accuracy_m = 4;
  float survey_target_m = 5;
  uint32 survey_s = 6;
  // A survey has finished and is not yet kept as a site (SaveBaseSite).
  bool survey_done = 7;
  // A name ready for the save box, e.g. "Site 3".
  string suggested_site_name = 8;
}

message BaseSites {
  repeated BaseSite sites = 1;
}

message BaseSite {
  string name = 1;
  // Where the base's antenna stands: WGS84, height above the ellipsoid.
  double latitude_deg = 2;
  double longitude_deg = 3;
  double height_m = 4;
}
